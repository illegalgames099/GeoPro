<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>GeoPro — Free 3D Maps</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='black'/%3E%3Cpath d='M22 18 L84 50 L22 82 L42 50 Z' fill='%23ff2d2d' stroke='%23ff3636' stroke-width='6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css" rel="stylesheet" />
<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js"></script>
<script src="https://unpkg.com/pmtiles@3.2.1/dist/pmtiles.js"></script>
<style>
  :root {
    --panel-bg: rgba(255, 255, 255, 0.92);
    --panel-text: #1a2233;
    --accent: #3d6bff;
    --shadow: 0 4px 18px rgba(15, 25, 55, 0.18);
    --glass-border: rgba(255, 255, 255, 0.55);
    --panel-border: rgba(255, 255, 255, 0.48);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  #map { position: absolute; inset: 0; background: #07111f; }

  /* ---------- Loading screen ---------- */
  #loadingScreen {
    position: fixed; inset: 0; z-index: 100;
    display: flex; align-items: center; justify-content: center;
    background:
      radial-gradient(circle at 50% 42%, rgba(255, 45, 45, .22), transparent 28rem),
      linear-gradient(145deg, #020202 0%, #080808 48%, #151515 100%);
    color: #fff; transition: opacity .55s ease, visibility .55s ease;
  }
  #loadingScreen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loaderCard {
    width: min(360px, calc(100vw - 42px)); text-align: center;
    padding: 34px 28px; border: 1px solid rgba(255,255,255,.16);
    border-radius: 24px; background: rgba(255,255,255,.08);
    box-shadow: 0 24px 80px rgba(0,0,0,.38); backdrop-filter: blur(18px);
  }
  .appLogo {
    width: 94px; height: 94px; margin: 0 auto 18px; border-radius: 24px;
    background: #000; position: relative; overflow: hidden;
    box-shadow:
      inset 0 0 0 1px rgba(255,255,255,.08),
      inset 0 0 18px rgba(255,255,255,.18),
      0 18px 48px rgba(0,0,0,.42),
      0 0 34px rgba(255,45,45,.24);
    animation: logoPulse 1.9s ease-in-out infinite;
  }
  .appLogo::before {
    content: ''; position: absolute; inset: 18px 14px;
    background: linear-gradient(135deg, #ff3131, #ff2020);
    clip-path: polygon(0 0, 100% 50%, 0 100%, 28% 50%);
    filter: drop-shadow(0 0 12px rgba(255,45,45,.42));
  }
  .appLogo::after {
    content: ''; position: absolute; inset: 0; border-radius: inherit;
    background: linear-gradient(145deg, rgba(255,255,255,.22), transparent 18%, transparent 76%, rgba(255,255,255,.16));
    pointer-events: none;
  }
  .globeLoader {
    width: 86px; height: 86px; margin: 0 auto 18px; border-radius: 50%;
    background: linear-gradient(135deg, #7dd3fc, #2563eb 52%, #22c55e);
    box-shadow: inset -14px -12px 24px rgba(0,0,0,.24), 0 0 36px rgba(96,165,250,.5);
    position: relative; animation: globePulse 1.8s ease-in-out infinite;
  }
  .globeLoader::after {
    content: ''; position: absolute; inset: 13px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.42); border-left-color: transparent;
    animation: spin 1.1s linear infinite;
  }
  .loaderCard h1 { margin: 0 0 6px; font-size: 24px; letter-spacing: .08em; }
  .loaderCard p { margin: 0 0 18px; color: rgba(255,255,255,.76); font-size: 14px; }
  #loadingStatus { display: block; min-height: 18px; margin-top: 12px; color: rgba(255,255,255,.68); font-size: 12.5px; }
  .progressTrack { height: 6px; overflow: hidden; border-radius: 999px; background: rgba(255,255,255,.14); }
  #progressBar { width: 12%; height: 100%; border-radius: inherit; background: linear-gradient(90deg, #ff4b4b, #ff2d2d, #ff6a3d); transition: width .35s ease; }
  @keyframes logoPulse { 50% { transform: translateY(-4px) scale(1.035); } }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes globePulse { 50% { transform: translateY(-4px) scale(1.04); } }
  @media (prefers-reduced-motion: reduce) {
    .appLogo, .globeLoader, .globeLoader::after { animation: none; }
    #loadingScreen, #progressBar { transition: none; }
  }

  /* Night/dusk tint overlay — sits on top of the map canvas */
  #tint {
    position: absolute; inset: 0;
    pointer-events: none;
    mix-blend-mode: multiply;
    background: transparent;
    transition: background 1.2s ease;
    z-index: 2;
  }

  /* ---------- Search bar ---------- */
  #searchWrap {
    position: absolute; top: 14px; left: 14px; z-index: 10;
    width: min(340px, calc(100vw - 28px));
  }
  #searchBox {
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-bg); backdrop-filter: blur(10px);
    border-radius: 12px; box-shadow: var(--shadow);
    padding: 10px 14px;
  }
  #searchBox svg { flex: none; opacity: .55; }
  #searchInput {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 15px; color: var(--panel-text);
  }
  #results {
    margin-top: 6px; background: var(--panel-bg); backdrop-filter: blur(10px);
    border-radius: 12px; box-shadow: var(--shadow); overflow: hidden;
    display: none;
  }
  #results div {
    padding: 10px 14px; font-size: 13.5px; color: var(--panel-text);
    cursor: pointer; border-bottom: 1px solid rgba(0,0,0,.06);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #results div:last-child { border-bottom: none; }
  #results div:hover { background: rgba(61,107,255,.1); }

  /* ---------- Bottom control pills ---------- */
  #hud {
    position: absolute; bottom: 26px; left: 50%; transform: translateX(-50%);
    z-index: 10; display: flex; gap: 10px; align-items: center;
  }
  .pillGroup {
    display: flex; background: var(--panel-bg); backdrop-filter: blur(10px);
    border: 1px solid var(--glass-border);
    border-radius: 999px; box-shadow: var(--shadow); overflow: hidden;
  }
  .pillGroup button {
    border: none; background: transparent; padding: 9px 16px;
    font-size: 13px; font-weight: 600; color: var(--panel-text);
    cursor: pointer; transition: background .15s, color .15s;
  }
  .pillGroup button.active { background: var(--accent); color: #fff; }
  .pillGroup button:not(.active):hover { background: rgba(61,107,255,.12); }

  /* ---------- Title chip ---------- */
  #brand {
    position: absolute; top: 14px; right: 14px; z-index: 10;
    display: flex; align-items: center; gap: 8px;
    background: var(--panel-bg); backdrop-filter: blur(10px);
    border-radius: 12px; box-shadow: var(--shadow);
    padding: 7px 13px 7px 8px; font-size: 13px; font-weight: 700; color: var(--panel-text);
    letter-spacing: .3px; user-select: none;
  }
  #brand span { color: #ff2d2d; }
  .brandLogo {
    width: 26px; height: 26px; border-radius: 8px; background: #000; position: relative; overflow: hidden;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.12), 0 3px 10px rgba(0,0,0,.18);
  }
  .brandLogo::before {
    content: ''; position: absolute; inset: 6px 4px; background: #ff2d2d;
    clip-path: polygon(0 0, 100% 50%, 0 100%, 28% 50%);
  }
  #brand span { color: var(--accent); }
  #modeChip {
    position: absolute; right: 14px; bottom: 26px; z-index: 10;
    max-width: min(310px, calc(100vw - 28px));
    padding: 10px 14px; border: 1px solid var(--panel-border);
    border-radius: 14px; background: rgba(255,255,255,.86);
    backdrop-filter: blur(12px); box-shadow: var(--shadow);
    color: var(--panel-text); font-size: 12.5px; line-height: 1.35;
  }
  #modeChip strong { display: block; color: var(--accent); font-size: 13px; margin-bottom: 2px; }

  /* Move maplibre zoom controls below the brand chip */
  .maplibregl-ctrl-top-right { top: 52px; }

  /* ---------- Directions ---------- */
  #dirToggle {
    flex: none; display: flex; align-items: center; justify-content: center;
    width: 30px; height: 30px; border: none; border-radius: 8px;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  #dirToggle:hover { filter: brightness(1.1); }
  #dirPanel {
    display: none; margin-top: 6px;
    background: var(--panel-bg); backdrop-filter: blur(10px);
    border-radius: 12px; box-shadow: var(--shadow);
    padding: 12px; flex-direction: column; gap: 8px;
  }
  #dirPanel.open { display: flex; }
  .dirRow { display: flex; align-items: center; gap: 8px; }
  .dirRow input {
    flex: 1; min-width: 0; border: 1px solid rgba(0,0,0,.12); border-radius: 8px;
    padding: 8px 10px; font-size: 13.5px; color: var(--panel-text);
    background: rgba(255,255,255,.7); outline: none;
  }
  .dirRow input:focus { border-color: var(--accent); }
  .dot { flex: none; width: 10px; height: 10px; border-radius: 50%; }
  .dotA { background: #2ecc71; }
  .dotB { background: #e74c3c; }
  #dirSwap, #dirClear {
    flex: none; border: none; border-radius: 8px; width: 32px; height: 32px;
    background: rgba(0,0,0,.06); color: var(--panel-text); cursor: pointer; font-size: 14px;
  }
  #dirSwap:hover, #dirClear:hover { background: rgba(0,0,0,.12); }
  .dirModes { gap: 6px; }
  .dirModes button {
    flex: 1; border: none; border-radius: 8px; padding: 7px 4px;
    font-size: 12.5px; font-weight: 600; color: var(--panel-text);
    background: rgba(0,0,0,.06); cursor: pointer;
  }
  .dirModes button.active { background: var(--accent); color: #fff; }
  #dirGo {
    flex: 1; border: none; border-radius: 8px; padding: 9px;
    background: var(--accent); color: #fff; font-size: 13.5px; font-weight: 700; cursor: pointer;
  }
  #dirGo:hover { filter: brightness(1.1); }
  #dirGo:disabled { opacity: .55; cursor: wait; }
  #dirSummary { font-size: 13.5px; font-weight: 700; color: var(--panel-text); }
  #routeChoices { display: none; gap: 6px; flex-direction: column; }
  #routeChoices.hasRoutes { display: flex; }
  .routeChoice {
    display: grid; grid-template-columns: 1fr auto; gap: 2px 8px; text-align: left;
    border: 1px solid rgba(61,107,255,.16); border-radius: 10px; padding: 8px 10px;
    background: rgba(61,107,255,.07); color: var(--panel-text); cursor: pointer;
  }
  .routeChoice.active { border-color: var(--accent); background: rgba(61,107,255,.16); box-shadow: inset 3px 0 0 var(--accent); }
  .routeChoice strong { font-size: 13px; }
  .routeChoice span { font-size: 12px; opacity: .72; }
  .routeChoice em { grid-row: span 2; align-self: center; font-style: normal; font-weight: 800; color: var(--accent); }
  #dirSummary:empty, #dirSteps:empty { display: none; }
  #dirSteps {
    max-height: 34vh; overflow-y: auto; font-size: 12.5px; color: var(--panel-text);
    border-top: 1px solid rgba(0,0,0,.08); padding-top: 6px;
  }
  #dirSteps div { padding: 7px 2px; border-bottom: 1px solid rgba(0,0,0,.05); }
  #dirSteps span { opacity: .6; float: right; margin-left: 8px; }

  /* Red GPS location dot (MapLibre's default is blue) */
  .maplibregl-user-location-dot,
  .maplibregl-user-location-dot::before {
    background-color: #e63b3b;
  }

  /* ---------- Toast ---------- */
  #toast {
    position: absolute; top: 74px; left: 50%; transform: translateX(-50%) translateY(-8px);
    z-index: 20; max-width: min(420px, calc(100vw - 28px));
    background: rgba(26, 34, 51, 0.94); color: #fff;
    padding: 10px 16px; border-radius: 10px; font-size: 13.5px;
    box-shadow: var(--shadow); opacity: 0; pointer-events: none;
    transition: opacity .25s, transform .25s;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 560px) {
    #brand { display: none; }
    .maplibregl-ctrl-top-right { top: 0; }
    #hud { bottom: 34px; flex-wrap: wrap; justify-content: center; width: calc(100vw - 24px); }
    #modeChip { display: none; }
    .pillGroup button { padding: 8px 12px; font-size: 12px; }
  }
</style>
</head>
<body>

<div id="loadingScreen" role="status" aria-live="polite">
  <div class="loaderCard">
    <div class="appLogo" aria-hidden="true"></div>
    <div class="globeLoader" aria-hidden="true"></div>
    <h1>GEOPRO</h1>
    <p>Loading satellite, terrain, vegetation, routes, and 3D buildings…</p>
    <div class="progressTrack"><div id="progressBar"></div></div>
    <span id="loadingStatus">Preparing 3D scene…</span>
  </div>
</div>

<div id="map"></div>
<div id="tint"></div>

<div id="brand"><i class="brandLogo" aria-hidden="true"></i>GEO<span>PRO</span></div>
<div id="modeChip"><strong>3D+ mode</strong><span>Terrain, buildings, and tree canopy are active.</span></div>

<div id="searchWrap">
  <div id="searchBox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#1a2233" stroke-width="2.4" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.5" y2="16.5"/>
    </svg>
    <input id="searchInput" type="text" placeholder="Search a city, address, place…" autocomplete="off" />
    <button id="dirToggle" title="Directions" aria-label="Directions">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 20v-9a3 3 0 0 1 3-3h9"/><path d="M14 4l4 4-4 4"/>
      </svg>
    </button>
  </div>
  <div id="results"></div>

  <div id="dirPanel">
    <div class="dirRow">
      <span class="dot dotA"></span>
      <input id="fromInput" type="text" placeholder="From — type, or click the map" autocomplete="off" />
    </div>
    <div class="dirRow">
      <span class="dot dotB"></span>
      <input id="toInput" type="text" placeholder="To — type, or click the map" autocomplete="off" />
      <button id="dirSwap" title="Swap">⇅</button>
    </div>
    <div class="dirRow dirModes">
      <button data-mode="car" class="active">🚗 Drive</button>
      <button data-mode="bike">🚴 Bike</button>
      <button data-mode="foot">🚶 Walk</button>
    </div>
    <div class="dirRow">
      <button id="dirGo">Get directions</button>
      <button id="dirClear" title="Clear route">✕</button>
    </div>
    <div id="routeChoices"></div>
    <div id="dirSummary"></div>
    <div id="dirSteps"></div>
  </div>
</div>

<div id="hud">
  <div class="pillGroup" id="viewToggle">
    <button data-view="3d" class="active">3D+</button>
    <button data-view="satellite">Satellite</button>
    <button data-view="2d">2D</button>
  </div>
  <div class="pillGroup" id="lightToggle">
    <button data-light="day" class="active">Day</button>
    <button data-light="dusk">Dusk</button>
    <button data-light="night">Night</button>
  </div>
</div>

<script>
/* =========================================================================
   GEOPRO — free Mapbox-Standard-style 3D map
   Engine : MapLibre GL JS  (open-source, free, same tech Mapbox GL is from)
   Tiles  : OpenFreeMap     (free vector tiles, no API key, no account)
   Search : Nominatim (OSM) (free geocoding, no API key)
   ========================================================================= */

// Overture Maps buildings (OSM + Microsoft + Google AI footprints combined)
// served as PMTiles straight from source.coop — free, no key.
maplibregl.addProtocol('pmtiles', new pmtiles.Protocol().tile);

const SATELLITE_MAX_ZOOM = 18.8;
const DEFAULT_MAX_ZOOM = 22;

const map = new maplibregl.Map({
  container: 'map',
  style: 'https://tiles.openfreemap.org/styles/liberty', // free, keyless vector style
  center: [-73.9857, 40.7484],  // Midtown Manhattan — great skyline demo
  zoom: 15.6,
  pitch: 68,
  bearing: -28,
  hash: true,                   // keeps view in the URL so links are shareable
  attributionControl: { compact: true },
  maxPitch: 85,
  maxZoom: DEFAULT_MAX_ZOOM,
  antialias: true
});

map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');

const geolocate = new maplibregl.GeolocateControl({
  positionOptions: { enableHighAccuracy: true },
  trackUserLocation: true,
  showAccuracyCircle: true,
  fitBoundsOptions: { maxZoom: 16.5 }
});
map.addControl(geolocate, 'top-right');

// Surface GPS problems instead of failing silently. Real GPS needs HTTPS
// (GitHub Pages / Netlify / Cloudflare are all HTTPS, so it works there).
geolocate.on('error', err => {
  const msg = err && err.code === 1
    ? 'Location permission denied — allow location access in your browser to use GPS.'
    : 'Could not get your location. GPS needs a secure (https) connection and location enabled.';
  showToast(msg);
});

map.addControl(new maplibregl.ScaleControl({ unit: 'metric' }), 'bottom-left');

const loadingScreen = document.getElementById('loadingScreen');
const progressBar = document.getElementById('progressBar');
const loadingStatus = document.getElementById('loadingStatus');
const modeChip = document.getElementById('modeChip');
const loadingMessages = [
  'Preparing 3D scene…',
  'Streaming satellite imagery…',
  'Shaping terrain elevation…',
  'Planting tree canopy…',
  'Extruding buildings…'
];
let progress = 12;
let loadingStep = 0;
let loadingDone = false;
const progressTimer = setInterval(() => {
  progress = Math.min(progress + Math.random() * 11, 92);
  progressBar.style.width = progress + '%';
  loadingStep = (loadingStep + 1) % loadingMessages.length;
  loadingStatus.textContent = loadingMessages[loadingStep];
}, 420);

function hideLoadingScreen() {
  if (loadingDone) return;
  loadingDone = true;
  clearInterval(progressTimer);
  loadingStatus.textContent = 'Ready';
  progressBar.style.width = '100%';
  setTimeout(() => loadingScreen.classList.add('hidden'), 350);
}

setTimeout(() => {
  if (!loadingDone) {
    loadingStatus.textContent = 'Still loading network map tiles…';
    hideLoadingScreen();
  }
}, 12000);


// Readable map error logging (tile/network failures etc.)
map.on('error', e => {
  const m = e && e.error ? (e.error.message || e.error.status || String(e.error)) : String(e);
  console.warn('Map error:', m, e && e.sourceId ? 'source=' + e.sourceId : '');
  if (!loadingDone && /terrain|satellite|pmtiles|network|fetch/i.test(m)) {
    loadingStatus.textContent = 'Some enhanced layers are unavailable, opening the map…';
    hideLoadingScreen();
  }
});

// Show a hint while the first tiles stream in, so a blank map doesn't look broken
map.once('idle', () => {
  const el = document.getElementById('toast');
  if (el) el.classList.remove('show');
  hideLoadingScreen();
});
setTimeout(() => { if (!map.loaded()) showToast('Loading map…'); }, 1500);

let toastTimer = null;
function showToast(text) {
  let el = document.getElementById('toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'toast';
    document.body.appendChild(el);
  }
  el.textContent = text;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 5000);
}

/* ------------------------------------------------------------------
   Lighting presets (mimics Mapbox Standard's day / dusk / night)
------------------------------------------------------------------- */
const PRESETS = {
  day: {
    tint: 'transparent',
    sky: { 'sky-color': '#8fc6f7', 'horizon-color': '#eaf4fb', 'fog-color': '#f4f8fb',
           'sky-horizon-blend': 0.6, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.7 },
    light: { anchor: 'viewport', color: '#ffffff', intensity: 0.35, position: [1.3, 210, 30] },
    buildingColors: [0, '#e8eaee', 20, '#dfe3e9', 60, '#ccd3dd', 120, '#b7c1cf', 250, '#a3aec0'],
    buildingOpacity: 0.96
  },
  dusk: {
    tint: 'rgba(255, 196, 150, 0.14)',
    sky: { 'sky-color': '#4a5b8c', 'horizon-color': '#f2a65e', 'fog-color': '#e8b98a',
           'sky-horizon-blend': 0.5, 'horizon-fog-blend': 0.6, 'fog-ground-blend': 0.6 },
    light: { anchor: 'viewport', color: '#ffd9a8', intensity: 0.4, position: [1.4, 110, 15] },
    buildingColors: [0, '#f2e0cf', 20, '#ecd4be', 60, '#dfc0a6', 120, '#ceab90', 250, '#bd977e'],
    buildingOpacity: 0.97
  },
  night: {
    tint: 'rgba(70, 90, 150, 0.30)',
    sky: { 'sky-color': '#0b1026', 'horizon-color': '#1d2a52', 'fog-color': '#141b38',
           'sky-horizon-blend': 0.45, 'horizon-fog-blend': 0.5, 'fog-ground-blend': 0.55 },
    light: { anchor: 'viewport', color: '#b8c6ff', intensity: 0.5, position: [1.5, 300, 55] },
    buildingColors: [0, '#5d6a8f', 20, '#576388', 60, '#4c577b', 120, '#424c6e', 250, '#394262'],
    buildingOpacity: 0.98
  }
};

// Overture height in meters where known; else estimate from floor count; else
// a sensible small-building default.
const BUILDING_HEIGHT = ['coalesce',
  ['get', 'height'],
  ['case', ['has', 'numfloors'], ['*', ['coalesce', ['get', 'numfloors'], 2], 3.2], 8]
];

function buildingColorExpr(stops) {
  const expr = ['interpolate', ['linear'], BUILDING_HEIGHT];
  for (let i = 0; i < stops.length; i += 2) expr.push(stops[i], stops[i + 1]);
  return expr;
}

let currentPreset = 'day';

function setModeChip(title, detail) {
  modeChip.innerHTML = '<strong>' + title + '</strong><span>' + detail + '</span>';
}

function applyPreset(name) {
  currentPreset = name;
  const p = PRESETS[name];
  document.getElementById('tint').style.background = p.tint;
  map.setSky(p.sky);
  map.setLight(p.light);
  if (map.getLayer('atlas-3d-buildings')) {
    map.setPaintProperty('atlas-3d-buildings', 'fill-extrusion-color', buildingColorExpr(p.buildingColors));
    map.setPaintProperty('atlas-3d-buildings', 'fill-extrusion-opacity', p.buildingOpacity);
  }
  if (map.getLayer('geo-vegetation-depth')) {
    map.setPaintProperty('geo-vegetation-depth', 'fill-opacity', name === 'night' ? 0.18 : ['interpolate', ['linear'], ['zoom'], 6, 0.16, 12, 0.28, 16, 0.38]);
  }
  if (map.getLayer('geo-tree-canopy')) {

map.on('load', () => {
  const style = map.getStyle();

  // Remove any fill-extrusion layers the base style ships, so ours is the only one

  // Insert our buildings just below the first label layer so text stays on top
  const firstLabel = map.getStyle().layers.find(l => l.type === 'symbol')?.id;

    tileSize: 256,
    maxzoom: 18,

    id: 'satellite-imagery',

      'raster-contrast': 0.12,
      'raster-brightness-min': 0.03
    }

  map.addLayer({

  // Stylized tree canopies. These read from the base vector style's landcover

    const vegetationFilter = ['in', ['get', 'class'], ['literal', ['wood', 'forest', 'tree', 'park', 'grass', 'scrub']]];
    map.addLayer({

  map.addSource('route-alternates', { type: 'geojson', data: { type: 'FeatureCollection', features: [] } });
  map.addLayer({

function setSatellite(enabled) {
  if (!map.getLayer('satellite-imagery')) return;
  map.setMaxZoom(enabled ? SATELLITE_MAX_ZOOM : DEFAULT_MAX_ZOOM);
  if (enabled && map.getZoom() > SATELLITE_MAX_ZOOM) {
    map.easeTo({ zoom: SATELLITE_MAX_ZOOM, duration: 450 });
    showToast('Satellite imagery is capped here so close zooms stay sharp instead of showing missing tiles.');
  }
  map.setPaintProperty('satellite-imagery', 'raster-opacity', enabled ? 0.88 : 0);
  if (map.getLayer('satellite-clarity')) {
    map.setPaintProperty('satellite-clarity', 'raster-opacity', enabled ? 0.28 : 0);
  }
  if (map.getLayer('geo-vegetation-depth')) {
    map.setPaintProperty('geo-vegetation-depth', 'fill-opacity', enabled ? 0.18 : ['interpolate', ['linear'], ['zoom'], 6, 0.16, 12, 0.28, 16, 0.38]);
  }
  if (map.getLayer('geo-vegetation-highlight')) {
    map.setPaintProperty('geo-vegetation-highlight', 'line-opacity', enabled ? 0.1 : ['interpolate', ['linear'], ['zoom'], 12, 0.08, 16, 0.18]);
  }
  if (map.getLayer('geo-tree-canopy')) {
    map.setPaintProperty('geo-tree-canopy', 'circle-opacity', enabled ? 0.5 : (currentPreset === 'night' ? 0.32 : 0.58));
  }
  if (map.getLayer('geo-tree-shadow')) {
    map.setPaintProperty('geo-tree-shadow', 'circle-opacity', enabled ? 0.22 : (currentPreset === 'night' ? 0.14 : 0.25));
  }
}

function setTerrain(exaggeration) {
  if (!map.getSource('terrain-dem')) return;

/* ------------------------------------------------------------------
   Search — Nominatim (free OSM geocoder, no key). Debounced to respect
   their usage policy (max 1 req/sec).
------------------------------------------------------------------- */
const input = document.getElementById('searchInput');
const resultsEl = document.getElementById('results');
let debounceTimer = null;
let searchMarker = null;
let lastResults = [];
let lastQuery = '';

input.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  const q = input.value.trim();
  if (q.length < 3) { resultsEl.style.display = 'none'; return; }
  debounceTimer = setTimeout(() => runSearch(q), 1100);
});

input.addEventListener('keydown', e => {
  if (e.key === 'Enter') {
    clearTimeout(debounceTimer);
    const q = input.value.trim();
    // Reuse results we already fetched for this query — avoids a second
    // Nominatim request inside their 1 req/sec limit.
    if (q === lastQuery && lastResults.length) {
      goTo(lastResults[0]);
    } else if (q.length >= 2) {
      runSearch(q, true);
    }
  }
  if (e.key === 'Escape') resultsEl.style.display = 'none';
});

async function runSearch(q, goFirst = false) {
  try {
    const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=5&q=' + encodeURIComponent(q);
    const res = await fetch(url, { headers: { 'Accept-Language': navigator.language || 'en' } });
    const data = await res.json();
    lastResults = data;
    lastQuery = q;
    resultsEl.innerHTML = '';
    if (!data.length) { resultsEl.style.display = 'none'; if (goFirst) showToast('No results for "' + q + '"'); return; }
    if (goFirst) { goTo(data[0]); return; }
    data.forEach(place => {
      const div = document.createElement('div');
      div.textContent = place.display_name;
      div.addEventListener('click', () => goTo(place));
      resultsEl.appendChild(div);
    });
    resultsEl.style.display = 'block';
  } catch (err) {
    console.warn('Search failed:', err);
  }
}

function goTo(place) {
  resultsEl.style.display = 'none';
  input.value = place.display_name.split(',')[0];
  const lng = parseFloat(place.lon), lat = parseFloat(place.lat);
  if (searchMarker) searchMarker.remove();
  searchMarker = new maplibregl.Marker({ color: '#3d6bff' }).setLngLat([lng, lat]).addTo(map);
  const isCity = ['city', 'town', 'state', 'country', 'county'].includes(place.type);
  map.flyTo({
    center: [lng, lat],
    zoom: isCity ? 12.5 : 16.2,
    pitch: 68,
    bearing: -28,
    duration: 2600,
    essential: true
  });
}

// Click anywhere on the results list's outside to close it
document.addEventListener('click', e => {
  if (!document.getElementById('searchWrap').contains(e.target)) {
    resultsEl.style.display = 'none';
  }
});

function clearRoute() {

function makeDragMarker(color, onDrag) {
  const m = new maplibregl.Marker({ color, draggable: true });
  m.on('dragend', () => {
    const p = m.getLngLat();
    onDrag({ lng: p.lng, lat: p.lat, q: null });
  });
  return m;
}

function syncMarkers() {
  if (fromPoint) {
    if (!fromMarker) {
      fromMarker = makeDragMarker('#2ecc71', p => {
        fromPoint = p;
        fromInput.value = fmtLngLat(p);
        if (toPoint) fetchRoute();
      });
    }
    fromMarker.setLngLat([fromPoint.lng, fromPoint.lat]).addTo(map);
  } else if (fromMarker) { fromMarker.remove(); fromMarker = null; }
  if (toPoint) {
    if (!toMarker) {
      toMarker = makeDragMarker('#e74c3c', p => {
        toPoint = p;
        toInput.value = fmtLngLat(p);
        if (fromPoint) fetchRoute();
      });
    }
    toMarker.setLngLat([toPoint.lng, toPoint.lat]).addTo(map);
  } else if (toMarker) { toMarker.remove(); toMarker = null; }
}

function fmtLngLat(p) {
  return p.lat.toFixed(5) + ', ' + p.lng.toFixed(5);
}

// With the panel open, clicking the map drops A first, then B
map.on('click', e => {

  if (!fromPoint) {
    fromPoint = p; fromInput.value = fmtLngLat(p);
  } else {
    toPoint = p; toInput.value = fmtLngLat(p);
  }
  syncMarkers();
  if (fromPoint && toPoint) fetchRoute();

async function geocodeOne(q) {
  const url = 'https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&q=' + encodeURIComponent(q);
  const res = await fetch(url, { headers: { 'Accept-Language': navigator.language || 'en' } });
  const data = await res.json();
  if (!data.length) throw new Error('No results for "' + q + '"');
  return { lng: parseFloat(data[0].lon), lat: parseFloat(data[0].lat), q };
}

const sleep = ms => new Promise(r => setTimeout(r, ms));

dirGo.addEventListener('click', async () => {
  dirGo.disabled = true;
  dirGo.textContent = 'Finding route…';
  try {
    // Resolve typed addresses that aren't resolved yet (spaced ≥1s for Nominatim)
    let geocoded = false;
    if (fromInput.value.trim() && (!fromPoint || (fromPoint.q && fromPoint.q !== fromInput.value.trim()))) {
      fromPoint = await geocodeOne(fromInput.value.trim());
      geocoded = true;
    }
    if (toInput.value.trim() && (!toPoint || (toPoint.q && toPoint.q !== toInput.value.trim()))) {
      if (geocoded) await sleep(1100);
      toPoint = await geocodeOne(toInput.value.trim());
    }
    if (!fromPoint || !toPoint) { showToast('Set both a start and a destination.'); return; }
    syncMarkers();
    await fetchRoute();
  } catch (err) {
    showToast(err.message || 'Could not find that place.');
  } finally {
    dirGo.disabled = false;
    dirGo.textContent = 'Get directions';
  }
});

[fromInput, toInput].forEach(inp => inp.addEventListener('keydown', e => {

}));

async function fetchRoute() {
  // If the user asks for a route before the style finishes loading, wait for
  // the load handler (which adds the route source/layers) to run first.
  if (!map.getSource('route')) {
    await new Promise(resolve => {
      if (map.getSource('route')) return resolve();
      map.once('idle', resolve);
    });
  }
  const profiles = {
    car: { service: 'routed-car', osrmProfile: 'driving' },
    bike: { service: 'routed-bike', osrmProfile: 'bike' },
    foot: { service: 'routed-foot', osrmProfile: 'foot' }
  };
  const profile = profiles[dirMode];
  const coords = fromPoint.lng + ',' + fromPoint.lat + ';' + toPoint.lng + ',' + toPoint.lat;
  const url = 'https://routing.openstreetmap.de/' + profile.service +
    '/route/v1/' + profile.osrmProfile + '/' + coords +
    '?overview=full&geometries=geojson&steps=true&alternatives=true';
  let data;
  try {
    const res = await fetch(url);
    data = await res.json();
  } catch (err) {
    showToast('Routing service unreachable — try again in a moment.');
    return;
  }
  if (data.code !== 'Ok' || !data.routes || !data.routes.length) {
    showToast('No route found between those points.');
    return;
  }
  currentRoutes = data.routes.slice(0, 3);
  activeRouteIndex = 0;
  renderRouteChoices();
  selectRoute(0, true);
}

function routeFeature(route) {
  return { type: 'Feature', properties: {}, geometry: route.geometry };
}

function renderRouteChoices() {
  routeChoices.innerHTML = '';
  routeChoices.classList.toggle('hasRoutes', currentRoutes.length > 1);
  currentRoutes.forEach((route, idx) => {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'routeChoice' + (idx === activeRouteIndex ? ' active' : '');
    const name = idx === 0 ? 'Fastest route' : 'Alternate ' + idx;
    button.innerHTML = '<strong>' + name + '</strong><em>' + fmtDuration(route.duration) + '</em><span>' + fmtDist(route.distance) + ' · ' + route.legs[0].summary + '</span>';
    button.addEventListener('click', () => selectRoute(idx, false));
    routeChoices.appendChild(button);
  });
}

function selectRoute(index, fit) {
  if (!currentRoutes[index]) return;
  activeRouteIndex = index;
  const route = currentRoutes[index];
  map.getSource('route').setData(routeFeature(route));
  if (map.getSource('route-alternates')) {
    map.getSource('route-alternates').setData({
      type: 'FeatureCollection',
      features: currentRoutes.filter((_, i) => i !== index).map(routeFeature)
    });
  }
  routeChoices.querySelectorAll('.routeChoice').forEach((button, i) => {
    button.classList.toggle('active', i === index);
  });
  renderRouteDetails(route);
  if (fit) fitRoute(route);
}

  });

function selectRoute(index, fit) {
  if (!currentRoutes[index]) return;

    });

  });

  if (fit) fitRoute(route);

function fitRoute(route) {
  const coords = route.geometry.coordinates;
  const bounds = coords.reduce(
    (b, c) => b.extend(c),
    new maplibregl.LngLatBounds(coords[0], coords[0])
  );
  map.fitBounds(bounds, { padding: { top: 140, bottom: 80, left: 48, right: 48 }, pitch: dirMode === 'car' ? 55 : 45, duration: 1400 });
}

function renderRouteDetails(route) {
  dirSummary.textContent = fmtDuration(route.duration) + '  ·  ' + fmtDist(route.distance) + '  ·  ' + route.legs[0].summary;
  dirSteps.innerHTML = '';
  route.legs[0].steps
    .filter(step => step.distance > 8 || ['depart', 'arrive'].includes(step.maneuver.type))
    .forEach((step, idx) => {
      const div = document.createElement('div');
      div.innerHTML = '<b>' + (idx + 1) + '.</b> ' + describeStep(step) + ' <span>' + (step.distance > 15 ? fmtDist(step.distance) : '') + '</span>';
      dirSteps.appendChild(div);
    });
}

function fmtDuration(seconds) {
  const mins = Math.max(1, Math.round(seconds / 60));
  return mins >= 60 ? Math.floor(mins / 60) + ' h ' + (mins % 60) + ' min' : mins + ' min';
}

function fmtDist(m) {
  return m >= 1000 ? (m / 1000).toFixed(1) + ' km' : Math.round(m) + ' m';
}

function esc(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

function describeStep(step) {
  const name = step.name ? 'onto <b>' + esc(step.name) + '</b>' : '';
  const mod = step.maneuver.modifier || '';
  switch (step.maneuver.type) {
    case 'depart': return 'Head out' + (step.name ? ' on <b>' + esc(step.name) + '</b>' : '');
    case 'arrive': return '<b>Arrive at your destination</b>' + (mod ? ' (on the ' + mod + ')' : '');
    case 'roundabout':
    case 'rotary': return 'At the roundabout, take exit ' + (step.maneuver.exit || 1) + (name ? ' ' + name : '');
    case 'merge': return 'Merge ' + mod + (name ? ' ' + name : '');
    case 'on ramp': return 'Take the ramp' + (name ? ' ' + name : '');
    case 'off ramp': return 'Take the exit' + (name ? ' ' + name : '');
    case 'fork': return 'Keep ' + (mod || 'straight') + ' at the fork' + (name ? ' ' + name : '');
    case 'end of road': return 'At the end of the road, turn ' + mod + (name ? ' ' + name : '');
    case 'continue':
    case 'new name': return mod && mod !== 'straight' ? 'Continue ' + mod + (name ? ' ' + name : '') : 'Continue' + (name ? ' ' + name : '');
    case 'turn': return 'Turn ' + mod + (name ? ' ' + name : '');
    default: return 'Continue' + (name ? ' ' + name : '');
  }
}
</script>
